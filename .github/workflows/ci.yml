name: Java CI with Maven

on:
  pull_request:
    branches:
      - main
      - dev-*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build and run tests
        run: mvn clean test
